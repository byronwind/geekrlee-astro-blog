<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="880" height="510" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <text x="28" y="42" font-size="19" font-weight="700" fill="#e2e8f0">内存预算：权重是书架，KV cache 是书桌</text>
  <text x="28" y="66" font-size="12.5" fill="#64748b">以 128GB 机器为例 · KV cache 为 128K 上下文时的额外占用</text>

  <!-- capacity line -->
  <line x1="726" y1="92" x2="726" y2="336" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="726" y="84" font-size="11.5" fill="#94a3b8" text-anchor="middle">128 GB 容量线</text>

  <!-- row 1: out of the box -->
  <text x="28" y="124" font-size="13" font-weight="600" fill="#e2e8f0">开箱状态</text>
  <rect x="150" y="110" width="288" height="24" rx="4" fill="#38bdf8"/>
  <rect x="438" y="110" width="288" height="24" rx="4" fill="#334155"/>
  <text x="160" y="127" font-size="12" font-weight="600" fill="#0f172a">GPU 默认分得 ≈ 64 GB</text>
  <text x="150" y="154" font-size="12" fill="#94a3b8">标称 128 GB，默认只有一半分给 GPU —— 上限可调，调完要在实际软件里确认生效</text>

  <!-- row 2: Qwen3-235B 3-bit -->
  <text x="28" y="208" font-size="13" font-weight="600" fill="#e2e8f0">Qwen3-235B</text>
  <text x="28" y="224" font-size="11" fill="#64748b">3-bit 量化</text>
  <rect x="150" y="194" width="472" height="24" rx="4" fill="#38bdf8"/>
  <rect x="622" y="194" width="113" height="24" rx="4" fill="#fbbf24"/>
  <text x="386" y="211" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">权重 ≈ 105 GB</text>
  <text x="678" y="211" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">KV ≈ 25 GB</text>
  <text x="150" y="240" font-size="12.5" font-weight="600" fill="#f87171">105 + 25 ≈ 130 GB：模型装得下，128K 上下文装不下（超出约 2 GB）</text>

  <!-- row 3: DeepSeek-style -->
  <text x="28" y="292" font-size="13" font-weight="600" fill="#e2e8f0">DeepSeek 类</text>
  <text x="28" y="308" font-size="11" fill="#64748b">压缩注意力</text>
  <rect x="150" y="278" width="400" height="24" rx="4" fill="#64748b"/>
  <rect x="550" y="278" width="40" height="24" rx="4" fill="#fbbf24"/>
  <text x="350" y="295" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">权重（随量化而定）</text>
  <text x="598" y="295" font-size="12" fill="#cbd5e1">KV@128K ≈ 9 GB</text>
  <text x="150" y="328" font-size="12.5" font-weight="600" fill="#34d399">同样是 128K 上下文，比 Qwen3 少用约 16 GB 的「书桌」</text>

  <!-- callout -->
  <rect x="28" y="356" width="824" height="124" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="384" font-size="13" font-weight="700" fill="#e2e8f0">三个容易算错的点</text>
  <text x="44" y="410" font-size="12.5" fill="#cbd5e1">① 标称内存 ≠ 可用内存：Strix Halo 默认只把约一半内存分给 GPU（128GB → ≈64GB）。</text>
  <text x="44" y="434" font-size="12.5" fill="#cbd5e1">② 权重的「书架」由量化决定，KV cache 的「书桌」随对话长度增长 —— 两者要分开算。</text>
  <text x="44" y="458" font-size="12.5" fill="#cbd5e1">③ 同样 128K 上下文：Qwen3-235B 要 ≈25 GB，DeepSeek 类只要 ≈9 GB，「书桌」差很多。</text>
</svg>
