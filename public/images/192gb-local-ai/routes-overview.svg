<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 590" font-family="-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="880" height="590" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <text x="28" y="42" font-size="19" font-weight="700" fill="#e2e8f0">拿大内存的六条路线：总内存 vs 价格</text>
  <text x="28" y="66" font-size="12.5" fill="#64748b">价格与速度为作者录制时汇总的数据（厂商标价 / 二手价 / 他人实测），仅供参考</text>

  <!-- row 1: 1x 3090 -->
  <text x="28" y="124" font-size="13" font-weight="600" fill="#e2e8f0">1× 二手 RTX 3090</text>
  <text x="28" y="140" font-size="11" fill="#64748b">专家层放系统内存</text>
  <rect x="252" y="117" width="19" height="22" rx="4" fill="#38bdf8"/>
  <text x="279" y="132" font-size="12" fill="#94a3b8">24 GB 显存</text>
  <text x="712" y="126" font-size="13" font-weight="600" fill="#fbbf24">≈ $1,500</text>
  <text x="712" y="144" font-size="12" fill="#34d399">解码 ≈25 tok/s · 预填充慢</text>

  <!-- row 2: 4x 3090 -->
  <text x="28" y="176" font-size="13" font-weight="600" fill="#e2e8f0">4× 二手 RTX 3090</text>
  <text x="28" y="192" font-size="11" fill="#64748b">PCIe 按层切分</text>
  <rect x="252" y="169" width="38" height="22" rx="4" fill="#38bdf8"/>
  <text x="298" y="184" font-size="12" fill="#94a3b8">48 GB 显存</text>
  <text x="712" y="178" font-size="13" font-weight="600" fill="#fbbf24">光四张卡 ≈ $5,800</text>
  <text x="712" y="196" font-size="12" fill="#f87171">同一时刻只有一张卡在干活</text>

  <!-- row 3: Strix Halo 128 -->
  <text x="28" y="228" font-size="13" font-weight="600" fill="#e2e8f0">Strix Halo 128GB</text>
  <text x="28" y="244" font-size="11" fill="#64748b">Ryzen AI Max 395</text>
  <rect x="252" y="221" width="100" height="22" rx="4" fill="#38bdf8"/>
  <text x="360" y="236" font-size="12" fill="#94a3b8">128 GB 统一内存</text>
  <text x="712" y="230" font-size="13" font-weight="600" fill="#fbbf24">$1,999 → ≈ $3,449</text>
  <text x="712" y="248" font-size="12" fill="#34d399">Qwen3-235B @3-bit ≈17 tok/s</text>

  <!-- row 4: DGX Spark -->
  <text x="28" y="280" font-size="13" font-weight="600" fill="#e2e8f0">DGX Spark（单台）</text>
  <text x="28" y="296" font-size="11" fill="#64748b">统一内存 · 不可扩容</text>
  <rect x="252" y="273" width="100" height="22" rx="4" fill="#38bdf8"/>
  <text x="360" y="288" font-size="12" fill="#94a3b8">128 GB 统一内存</text>
  <text x="712" y="282" font-size="13" font-weight="600" fill="#fbbf24">$4,000 → ≈ $7,000</text>
  <text x="712" y="300" font-size="12" fill="#34d399">GPT-OSS-120B 41–60 tok/s</text>

  <!-- row 5: Strix Halo 192 -->
  <text x="28" y="332" font-size="13" font-weight="600" fill="#e2e8f0">Strix Halo 192GB</text>
  <text x="28" y="348" font-size="11" fill="#64748b">Ryzen AI Max Pro 495</text>
  <rect x="252" y="325" width="150" height="22" rx="4" fill="#38bdf8"/>
  <text x="410" y="340" font-size="12" fill="#94a3b8">192 GB</text>
  <text x="712" y="334" font-size="13" font-weight="600" fill="#fbbf24">≈ $6,799</text>
  <text x="712" y="352" font-size="12" fill="#94a3b8">尚无公开测速</text>

  <!-- row 6: B60 x8 -->
  <text x="28" y="384" font-size="13" font-weight="600" fill="#e2e8f0">8× Arc Pro B60</text>
  <text x="28" y="400" font-size="11" fill="#64748b">Battle Matrix</text>
  <rect x="252" y="377" width="150" height="22" rx="4" fill="#a78bfa"/>
  <text x="410" y="392" font-size="12" fill="#94a3b8">192 GB（纸面）</text>
  <text x="712" y="386" font-size="13" font-weight="600" fill="#fbbf24">无个人可买标价</text>
  <text x="712" y="404" font-size="12" fill="#f87171">4 → 8 张卡吞吐量反降</text>

  <!-- row 7: 2x Spark -->
  <text x="28" y="436" font-size="13" font-weight="600" fill="#e2e8f0">2× DGX Spark 直连</text>
  <text x="28" y="452" font-size="11" fill="#64748b">最快，也最贵</text>
  <rect x="252" y="429" width="200" height="22" rx="4" fill="#38bdf8"/>
  <text x="460" y="444" font-size="12" fill="#94a3b8">256 GB</text>
  <text x="712" y="438" font-size="13" font-weight="600" fill="#fbbf24">≈ $13,900</text>
  <text x="712" y="456" font-size="12" fill="#34d399">DeepSeek V4 Flash ≈65 tok/s</text>

  <!-- row 8: Mac Studio -->
  <text x="28" y="488" font-size="13" font-weight="600" fill="#e2e8f0">M3 Ultra Mac Studio</text>
  <text x="28" y="504" font-size="11" fill="#64748b">对标基准 · 已停售</text>
  <rect x="252" y="481" width="400" height="22" rx="4" fill="#475569"/>
  <text x="660" y="496" font-size="12" fill="#94a3b8">512 GB</text>
  <text x="712" y="490" font-size="13" font-weight="600" fill="#fbbf24">≈ $9,499</text>
  <text x="712" y="508" font-size="12" fill="#94a3b8">已停售</text>

  <text x="28" y="546" font-size="12" fill="#64748b">条形长度 = 总内存（0–512 GB） · 紫色 = 纸面内存 · 灰色 = 对标基准（已停售）</text>
  <text x="28" y="570" font-size="12.5" font-weight="600" fill="#e2e8f0">结论：最便宜能真跑 235B 的是 128GB Strix Halo；最快的是双 Spark，也最贵</text>
</svg>
